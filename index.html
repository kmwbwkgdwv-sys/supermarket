<!DOCTYPE html>

  <meta name="x5-orientation" content="landscape">
  <meta name="theme-color" content="#ff6b35">

  <title>マートメイツ - みんなでスーパー経営</title>
  <meta name="apple-mobile-web-app-title" content="マートメイツ">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="マートメイツ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {

    }
  }

<body>
  <canvas id="c3d"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="touch" class="touch hidden"></div>

  <div id="modals"></div>
  <div id="toasts"></div>

  <div id="boot" class="boot">
    <div class="boot-badge">🛒</div>
    <div class="boot-title">マートメイツ</div>
    <div class="boot-sub">みんなでスーパー経営</div>
    <div class="bar"><i></i></div>
    <div class="boot-msg">読み込み中…</div>
  </div>
  <noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
  <script type="module" src="js/main.js"></script>
